# SonarCloud の自動解析の設定（デフォルトブランチ main のこのファイルが読まれる。sonar-project.properties は読まれない）。
#
# 重複（copy-paste detection）の対象から外す:
# - tests/: 正解データ（Ruby 版の出力）と、差分テスト用の利用者プラグイン。golden ケースの変種は
#   既存のプラグインを複製して差分だけを足すので、重複して当然（品質ゲートの「新規コードの重複」を満たせない）
# - tools/golden/inputs/: 正解データを採るための合成入力（Ruby 版のプラグインと CDL）
#
# 自動解析のドキュメントには「ワイルドカードは使えない」とあるが、コミュニティには ** を使って効いた報告もある。
# 効かなければ、解析の Background Tasks の SonarScanner context で実際の値を確認すること。
#
# 生成ファイル（racc の LALR 表。tools/port/gen_racc_tables.py が作る）も重複の対象から外す。
# 構文が違っても表の数値列が似るため、行数の多い新しい表を足すたびに「新規コードの重複」が上がる。
sonar.cpd.exclusions=tests/**,tools/golden/inputs/**,src/tecsgen/**/*_tables.py
#
# 解析そのものから外す: tcflow の差分テストの入力（tests/golden/tcflow/inputs/）。
# Ruby 版 tcflow に読ませるための C ファイルで、K&R 形式の定義や null の関数ポインタ呼び出しなど、
# 構文解析器を試すために意図して書いた内容を含む。C の解析器が BUG・CODE_SMELL として拾ってしまう。
sonar.exclusions=tests/golden/tcflow/inputs/**
