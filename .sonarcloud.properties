# SonarCloud の自動解析の設定（デフォルトブランチ main のこのファイルが読まれる。sonar-project.properties は読まれない）。
#
# 重複（copy-paste detection）の対象から外す:
# - tests/: 正解データ（Ruby 版の出力）と、差分テスト用の利用者プラグイン。golden ケースの変種は
#   既存のプラグインを複製して差分だけを足すので、重複して当然（品質ゲートの「新規コードの重複」を満たせない）
# - tools/golden/inputs/: 正解データを採るための合成入力（Ruby 版のプラグインと CDL）
#
# 自動解析のドキュメントには「ワイルドカードは使えない」とあるが、コミュニティには ** を使って効いた報告もある。
# 効かなければ、解析の Background Tasks の SonarScanner context で実際の値を確認すること。
sonar.cpd.exclusions=tests/**,tools/golden/inputs/**
