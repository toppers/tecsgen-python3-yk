[project]
name = "tecsgen-python3"
version = "0.1.0"
description = "tecsgen (TECS component description compiler) ported to Python 3"
readme = "README.md"
authors = [
    { name = "ykominami", email = "ykominami@gmail.com" }
]
requires-python = ">=3.13.11"
dependencies = [
    "tree-sitter>=0.26.0",
]

[project.scripts]
tecsgen = "tecsgen:main"
example = "tecsgen.example:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tecsgen"]
