[project]
name = "tecsge-python3"
version = "0.1.0"
description = "tecsgen with Ptyhon 3"
readme = "README.md"
authors = [
    { name = "ykominami", email = "ykominami@gmail.com" }
]
requires-python = ">=3.13.11"
dependencies = [
    "my>=1.3.0",
    "pytest>=9.1.1",
    "tuff>=0.0.1",
    "ty>=0.0.82",
    "yklibpy>=0.2.14",
]

[project.scripts]
tecsge-python3 = "tecsge_python3:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
yklibpy = { path = "../yklibpy", editable = true }
