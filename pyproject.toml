[project]
name = "tecsgen-python3"
version = "0.1.0"
description = "tecsgen (TECS component description compiler) ported to Python 3"
readme = "README.md"
authors = [
    { name = "ykominami", email = "ykominami@gmail.com" }
]
requires-python = ">=3.13.11"
dependencies = [
    "tree-sitter>=0.26.0",
]

[project.scripts]
tecsgen = "tecsgen:main"
example = "tecsgen.example:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    # setup.py の型チェック用（ビルド自体は build-system の setuptools で行う）
    "setuptools>=77",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]

[build-system]
# tree-sitter 文法を C 拡張としてビルドするため setuptools を使う（拡張の定義は setup.py）
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tecsgen.syntax" = ["*.pyi", "grammars/*/node-types.json", "grammars/README.md"]
