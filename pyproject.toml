[project]
name = "tecsgen-python3"
version = "0.1.0"
description = "tecsgen (TECS component description compiler) ported to Python 3"
readme = "README.md"
authors = [
    { name = "ykominami", email = "ykominami@gmail.com" }
]
requires-python = ">=3.13.11"
dependencies = []

[project.scripts]
tecsgen = "tecsgen:main"
tecsmerge = "tecsgen.tecsmerge:main"
tecsgen-path = "tecsgen.libpath:entry"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden"]

[tool.ruff.lint.per-file-ignores]
# Ruby 版と同名のモジュール（パッケージ構成決定）
"src/tecsgen/plugin/**" = ["N999"]
"src/tecsgen/messages/**" = ["N999"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tecsgen"]
