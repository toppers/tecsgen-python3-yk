# カーネル依存プラグイン（HRP・FMP など）の正解データを採取するケース一覧。
#
# TOPPERS カーネル（hrp3+tecs・fmp3+tecs）の sample アプリケーションについて、
# `configure.rb` → `make tecs` で tecsgen が実行される流れを再現する。
# 各ケースの `tecs_kernel/kernel.cdl` が `generate(HRPObjectPlugin, ...)` などで
# カーネル依存プラグインを起動する。
#
#   id         : ケース名（出力ディレクトリ名になる）
#   repo       : --repos-root 直下のリポジトリ名（trunk を持つもの）
#   target     : ターゲット名（configure.rb の -T）。ケースの識別と記録用
#   configure  : obj/ で実行する configure.rb の引数

# ---------------------------------------------------------------- hrp3+tecs
[[case]]
id = "hrp3/blueninja_gcc/sample1"
repo = "hrp3+tecs"
target = "blueninja_gcc"
configure = ["-T", "blueninja_gcc", "-t", "-A", "sample1", "-a", "../sample", "-C", "sample1.cdl", "-c", "sample1.cfg"]

[[case]]
id = "hrp3/ct11mpcore_gcc/sample1"
repo = "hrp3+tecs"
target = "ct11mpcore_gcc"
configure = ["-T", "ct11mpcore_gcc", "-t", "-A", "sample1", "-a", "../sample", "-C", "sample1.cdl", "-c", "sample1.cfg"]

# ---------------------------------------------------------------- fmp3+tecs
[[case]]
id = "fmp3/zybo_gcc/sample1"
repo = "fmp3+tecs"
target = "zybo_gcc"
configure = ["-T", "zybo_gcc", "-t", "-A", "sample1", "-a", "../sample", "-C", "sample1.cdl", "-c", "sample1.cfg"]

[[case]]
id = "fmp3/zybo_gcc/tSample2"
repo = "fmp3+tecs"
target = "zybo_gcc"
configure = ["-T", "zybo_gcc", "-t", "-A", "tSample2", "-a", "../sample", "-C", "tSample2.cdl", "-c", "tSample2.cfg"]

# ---------------------------------------------------------------- hrmp3+tecs
# tecs_kernel/kernel.cdl が generate(HRMPKernelObjectPlugin, ...) を使う。
# target/zybo_gcc は Makefile.target が無く make が失敗するので使わない（zybo_z7_gcc を使う）
[[case]]
id = "hrmp3/zybo_z7_gcc/sample1"
repo = "hrmp3+tecs"
target = "zybo_z7_gcc"
configure = ["-T", "zybo_z7_gcc", "-t", "-A", "sample1", "-a", "../sample", "-C", "sample1.cdl", "-c", "sample1.cfg"]

[[case]]
id = "hrmp3/zybo_z7_gcc/tSample2"
repo = "hrmp3+tecs"
target = "zybo_z7_gcc"
configure = ["-T", "zybo_z7_gcc", "-t", "-A", "tSample2", "-a", "../sample", "-C", "tSample2.cdl", "-c", "tSample2.cfg"]

# ---------------------------------------------------------------- ev3rt+tecs
# HRP2 ベース（hr-tecs）。include/kernel.cdl が generate(HRP2*Plugin, ...) を使い、
# アプリケーション CDL が MrubyBridgePlugin なども使う。
# 古い構成のため configure は使わず、hr-tecs/workspace/<名前>/ の Makefile で `make tecs` を実行する。
# tecsgen は hr-tecs/tecsgen/tecsgen/ に置く（Makefile が $(SRCDIR)/tecsgen/tecsgen/tecsgen.rb を呼ぶ）。
# hrp2+tecs の sample1 は、region の古い文法（domain(DOMAIN1) など）が現行の tecsgen で
# 構文エラー（G1016）になり、HRP2 プラグインまで進まないので使わない。
[[case]]
id = "ev3rt/ev3_gcc/sample1"
repo = "ev3rt+tecs"
target = "ev3_gcc"
workdir = "hr-tecs/workspace/sample1"
tecsgen_dest = "hr-tecs/tecsgen/tecsgen"

[[case]]
id = "ev3rt/ev3_gcc/sd"
repo = "ev3rt+tecs"
target = "ev3_gcc"
workdir = "hr-tecs/workspace/sd"
tecsgen_dest = "hr-tecs/tecsgen/tecsgen"

[[case]]
id = "ev3rt/ev3_gcc/bluetooth"
repo = "ev3rt+tecs"
target = "ev3_gcc"
workdir = "hr-tecs/workspace/bluetooth"
tecsgen_dest = "hr-tecs/tecsgen/tecsgen"

# ---------------------------------------------------------------- atk1+tecs
# include/kernel.cdl が generate(ATK1EventPlugin, "") ほか ATK1 のプラグインを使う。
# Makefile が無く、tecsgen は Renesas の ProjectEditor（tools/m16c-renesas/.../*.tmk の
# tecsgen ターゲット）が呼ぶ。そこに書かれた呼び出し
#   tecsgen.exe -v -L -U -D TECS -c "$(CPP) -D NC30" -I<config/m16c-renesas> -I<.../oaks16_mini>
#               -I<include> -I<tools/r16c-renesas/oaks16_mini_ecc2> sample.c
# を、現行の tecsgen（r3304）向けに次のとおり置き換えた（NC30 が無く、Windows のパスでもないため）:
#   - 末尾の sample.c は sample.cdl（.tmk の誤記と判断。inferred）
#   - -c の C プリプロセッサは、NC30 ではなくホストの gcc -E（-D NC30 は残す）
#   - -L -U は外し、syslib の import に必要な -I（リポジトリ直下・syslib・syslib/m16c-renesas/oaks16_mini・カレント）を足した
#   - .tmk の -I tools/r16c-renesas/... は存在しないパス（誤記）なので使わない
# コミット済みの古い gen/ は消してから実行する（clean）。
[[case]]
id = "atk1/oaks16_mini_ecc2/sample"
repo = "atk1+tecs"
target = "oaks16_mini_ecc2"
workdir = "tools/m16c-renesas/oaks16_mini_ecc2"
tecsgen_dest = "tecsgen"
clean = ["gen"]
tecsgen_args = ["-v", "-D", "TECS", "--cpp=gcc -E -D NC30", "-I../../../config/m16c-renesas", "-I../../../config/m16c-renesas/oaks16_mini", "-I../../../include", "-I../../..", "-I../../../syslib", "-I../../../syslib/m16c-renesas/oaks16_mini", "-I.", "sample.cdl"]

# 上と同じで -U（最適化なし）を付けたもの。.tmk の呼び出しは -U を使う。
# （.tmk の `-L -U` は、r3304 では -L が引数を取るため -U が -L の引数になってしまう。-L は不要なので外し、-U だけ残す）
[[case]]
id = "atk1/oaks16_mini_ecc2/sample-U"
repo = "atk1+tecs"
target = "oaks16_mini_ecc2"
workdir = "tools/m16c-renesas/oaks16_mini_ecc2"
tecsgen_dest = "tecsgen"
clean = ["gen"]
tecsgen_args = ["-v", "-U", "-D", "TECS", "--cpp=gcc -E -D NC30", "-I../../../config/m16c-renesas", "-I../../../config/m16c-renesas/oaks16_mini", "-I../../../include", "-I../../..", "-I../../../syslib", "-I../../../syslib/m16c-renesas/oaks16_mini", "-I.", "sample.cdl"]

# ---------------------------------------------------------------- hrp2+tecs / ev3rt+tecs（合成入力）
# HRP2 の個別カーネルオブジェクトプラグイン（HRP2SemaphorePlugin ほか）・HRP2SVCPlugin・HRP2RPCPlugin・
# HRP2CyclicHandlerPlugin・HRP2AlarmHandlerPlugin は、実プロジェクトの CDL が一度も使わない。
#   - hrp2+tecs の sample1 は、region の古い文法（domain(DOMAIN1) など）が現行の tecsgen で構文エラー（G1016）になる
#   - ev3rt+tecs の kernel.cdl は HRP2ObjectPlugin・HRP2HandlerPlugin を使い、個別プラグインを使わない
# そのため、カーネルの CDL を import する合成アプリケーション（tools/golden/inputs/hrp2/）を、
# カーネルのリポジトリ直下の obj-golden/ に置いて実行する（inputs）。tecsgen は現行（r3304）の文法で呼ぶ。
# 個別プラグインを generate しているのは hrp2+tecs の include/kernel.cdl、tMessageBuffer を持つのは
# ev3rt+tecs の hr-tecs/include/kernel.cdl なので、RPC だけ ev3rt+tecs を使う。
# C プリプロセッサは既定の gcc -E（ターゲットの交差コンパイラは不要）。
[[case]]
id = "hrp2/objects"
repo = "hrp2+tecs"
target = "synthetic"
inputs = "hrp2"
tecsgen_args = ["-k", "euc", "-R", "-D", "TECS", "-D", "TECS_CPP", "-I.", "-I./gen", "-I../tecs_kernel", "-I../include", "-I../arch", "-I..", "-I../target/stm32p207_gcc", "-I../arch/arm_m_gcc/stm32f", "-I../arch/arm_m_gcc/common", "hrp2_objects.cdl"]

# 周期ハンドラ・アラームハンドラのプラグインは、領域の古い API でカーネルドメインを判定していて、
# domain(HRP2, "trusted") の region に置いても必ず例外になる。例外で止まるので1ケースに1種類
[[case]]
id = "hrp2/cyclic"
repo = "hrp2+tecs"
target = "synthetic"
inputs = "hrp2"
tecsgen_args = ["-k", "euc", "-R", "-D", "TECS", "-D", "TECS_CPP", "-I.", "-I./gen", "-I../tecs_kernel", "-I../include", "-I../arch", "-I..", "-I../target/stm32p207_gcc", "-I../arch/arm_m_gcc/stm32f", "-I../arch/arm_m_gcc/common", "hrp2_cyclic.cdl"]

[[case]]
id = "hrp2/alarm"
repo = "hrp2+tecs"
target = "synthetic"
inputs = "hrp2"
tecsgen_args = ["-k", "euc", "-R", "-D", "TECS", "-D", "TECS_CPP", "-I.", "-I./gen", "-I../tecs_kernel", "-I../include", "-I../arch", "-I..", "-I../target/stm32p207_gcc", "-I../arch/arm_m_gcc/stm32f", "-I../arch/arm_m_gcc/common", "hrp2_alarm.cdl"]

[[case]]
id = "hrp2/rpc"
repo = "ev3rt+tecs"
target = "synthetic"
inputs = "hrp2"
tecsgen_dest = "hr-tecs/tecsgen/tecsgen"
tecsgen_args = ["-k", "euc", "-R", "-D", "TECS", "-D", "TECS_CPP", "-I.", "-I./gen", "-I../hr-tecs/tecs_kernel", "-I../hr-tecs/include", "-I../hr-tecs/arch", "-I../hr-tecs", "-I../hr-tecs/target/ev3_gcc", "-I../hr-tecs/arch/arm_gcc/am1808", "-I../hr-tecs/arch/arm_gcc/common", "-I../hr-tecs/arch/gcc", "hrp2_rpc.cdl"]

# GenHRP2Marshaler はポインタ引数のビット幅を決められず、例外で止まる
[[case]]
id = "hrp2/rpc_ptr"
repo = "ev3rt+tecs"
target = "synthetic"
inputs = "hrp2"
tecsgen_dest = "hr-tecs/tecsgen/tecsgen"
tecsgen_args = ["-k", "euc", "-R", "-D", "TECS", "-D", "TECS_CPP", "-I.", "-I./gen", "-I../hr-tecs/tecs_kernel", "-I../hr-tecs/include", "-I../hr-tecs/arch", "-I../hr-tecs", "-I../hr-tecs/target/ev3_gcc", "-I../hr-tecs/arch/arm_gcc/am1808", "-I../hr-tecs/arch/arm_gcc/common", "-I../hr-tecs/arch/gcc", "hrp2_rpc_ptr.cdl"]

# ---------------------------------------------------------------- hrp3+tecs sample2（HRPRPCPlugin）
# sample2.cdl は SubTaskBody1（rDomain1）から rDomain2 のセル（SampleSharedObject2・Dataqueue1）を呼ぶ。
# 別のユーザドメイン間の結合なので、HRPPlugin が HRPRPCPlugin（"noClientSemaphore=false,PPAllocatorSize=256"）を挿入する。
# 既存の hrp3 ケース（sample1）は単一ドメインで、この経路を通らない。
[[case]]
id = "hrp3/blueninja_gcc/sample2"
repo = "hrp3+tecs"
target = "blueninja_gcc"
configure = ["-T", "blueninja_gcc", "-t", "-A", "sample2", "-a", "../sample", "-C", "sample2.cdl", "-c", "sample2.cfg"]

[[case]]
id = "hrp3/blueninja_gcc/tSample2"
repo = "hrp3+tecs"
target = "blueninja_gcc"
configure = ["-T", "blueninja_gcc", "-t", "-A", "tSample2", "-a", "../sample", "-C", "tSample2.cdl", "-c", "tSample2.cfg"]

# ---------------------------------------------------------------- et_robcon atk1+tecs（ATK1DelayTaskPlugin）
# nxt_sample の tSample.cdl が tecs_lib/mindstorms_nxt/target_lib_decl.cdl の tDelayTask（ATK1DelayTaskPlugin を
# generate している）を使う。各サンプルの Makefile の `make tecs` を再現する。
# 同梱の tecsgen は無いので、移植元（r3304）を tecsgen/tecsgen に置く。
# ATK1KernelPlugin 側が id の重複（S3003・S3001）をエラーにするが、make は続けて成功で終わる（Ruby 版の振る舞い）。
[[case]]
id = "et_robcon/nxt_sample/etrobo"
repo = "et_robcon+atk1"
repo_dir = "et_robcon/trunk/atk1+tecs"
target = "lego_nxt"
workdir = "nxt_sample/ATK1+TECS_sample_etrobo"
tecsgen_dest = "tecsgen/tecsgen"

[[case]]
id = "et_robcon/nxt_sample/et2011"
repo = "et_robcon+atk1"
repo_dir = "et_robcon/trunk/atk1+tecs"
target = "lego_nxt"
workdir = "nxt_sample/ATK1+TECS_sample_et2011"
tecsgen_dest = "tecsgen/tecsgen"

[[case]]
id = "et_robcon/nxt_sample/mini"
repo = "et_robcon+atk1"
repo_dir = "et_robcon/trunk/atk1+tecs"
target = "lego_nxt"
workdir = "nxt_sample/ATK1+TECS_sample_mini"
tecsgen_dest = "tecsgen/tecsgen"

[[case]]
id = "et_robcon/nxt_sample/syslog"
repo = "et_robcon+atk1"
repo_dir = "et_robcon/trunk/atk1+tecs"
target = "lego_nxt"
workdir = "nxt_sample/ATK1+TECS_sample_syslog"
tecsgen_dest = "tecsgen/tecsgen"

# 上の sample2 は Ruby 版が S9999（rDomain2 not found or not region）で途中で止まる。
# SerialPort1 の restrict が、後ろで宣言される rDomain1・rDomain2 を名前で参照するため。
# その2つの region を kernel の region より前に（空で）宣言して、最後まで通す
# （region の指定 [domain(...)] は最初の宣言だけに置けるので、後ろの宣言からは外す）。
# HRPRPCPlugin の出力まで採れるのは、こちら。
[[case]]
id = "hrp3/blueninja_gcc/sample2_rpc"
repo = "hrp3+tecs"
target = "blueninja_gcc"
configure = ["-T", "blueninja_gcc", "-t", "-A", "sample2", "-a", "../sample", "-C", "sample2.cdl", "-c", "sample2.cfg"]
patch = [
  { file = "sample/sample2.cdl", find = "[domain(HRP, \"user\")]\nregion rDomain1{\n    cell tTask Task1;", replace = "region rDomain1{\n    cell tTask Task1;" },
  { file = "sample/sample2.cdl", find = "[domain(HRP, \"user\")]\nregion rDomain2{\n    cell tSampleSharedObject", replace = "region rDomain2{\n    cell tSampleSharedObject" },
  # rDomain2 の Dataqueue1 は rDomain1 から結合されるカーネルオブジェクトなので、HRPPlugin が
  # 「複数のユーザドメインから結合されるカーネルオブジェクトはドメインの外に置け」とエラーにする。無所属にする
  { file = "sample/sample2.cdl", find = "cDataqueue = rDomain2::Dataqueue1.eDataqueue;", replace = "cDataqueue = Dataqueue1.eDataqueue;" },
  # oneway で [in] のポインタ引数を持つ関数を足し、HRPRPCPlugin の「PPAllocator が必要」の経路も通す
  # （元の sGetSharedObject・sSetSharedObject は値渡しだけで、PPAllocatorSize を指定すると警告になる）
  { file = "sample/sample2.cdl", find = "    uint32_t getTaskLoop(void);\n};", replace = "    uint32_t getTaskLoop(void);\n    [oneway]\n    void putBuffer([in,size_is(len)] const uint8_t *buf, [in] int32_t len);\n};" },
  { file = "sample/sample2.cdl", find = "    cell tDataqueue Dataqueue1 {\n    };\n};", replace = "};\n\ncell tDataqueue Dataqueue1 {\n};" },
  { file = "sample/sample2.cdl", find = "region rKernelDomain {\n/*\n *  システムログ機能の組上げ記述", replace = "[domain(HRP, \"user\")]\nregion rDomain1{\n};\n\n[domain(HRP, \"user\")]\nregion rDomain2{\n};\n\nregion rKernelDomain {\n/*\n *  システムログ機能の組上げ記述" },
]
