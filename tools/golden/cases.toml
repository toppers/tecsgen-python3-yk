# Ruby 版 tecsgen の正解データを採取するテストケース一覧。
#
# 移植元リポジトリの test/ 配下の Makefile・シェルスクリプト（test-normal.sh、
# test-abnormal.sh、ErrorCase/test_err.sh）から tecsgen の呼び出しを抜き出したもの。
# make や gcc による C コンパイルは行わず、tecsgen の実行だけを再現する。
#
#   id       : ケース名（出力ディレクトリ名になる）
#   cwd      : 実行ディレクトリ（test/ からの相対パス）
#   args     : tecsgen に渡す引数。{TECSPATH} は作業コピー内の tecsgen/tecs に置換される
#   source   : 抜き出し元（Makefile とターゲット）
#   expect   : ErrorCase の期待件数 [エラー数, 警告数]（test_err.sh の引数）
#   skip     : 採取しない理由（指定時のみ）

[defaults]
# メッセージ言語を固定する（英語）
env = { LANG = "C" }

# ---------------------------------------------------------------- test/Makefile 直下
# TECSGEN = tecsgen -I RUNTIME/runtime/include -I RUNTIME/runtime/test

[[case]]
id = "top/singleton"
cwd = "."
args = ["-I", "RUNTIME/runtime/include", "-I", "RUNTIME/runtime/test", "singleton.cdl"]
source = "Makefile [singleton]"

